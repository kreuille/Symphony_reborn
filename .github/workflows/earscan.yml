name: earscan

on:
  push:
    paths: ["earscan/**", ".github/workflows/earscan.yml"]
  pull_request:
    paths: ["earscan/**", ".github/workflows/earscan.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: earscan/requirements.txt
      - run: pip install -r earscan/requirements.txt pytest
      - run: python -m pytest earscan -q
